plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.dokka'
}

android {
    namespace 'com.sujanix.cruxmdm'
    compileSdk 34

    defaultConfig {
        applicationId "com.sujanix.cruxmdm"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.0.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.datastore:datastore-preferences-core:1.1.1'
    implementation 'com.google.firebase:firebase-config:22.0.0'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'

    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    //AMAPI----------------------------------------------------------------------

    implementation 'com.google.android.libraries.enterprise.amapi:amapi:1.1.5'

    //DPC Support Library--------------------------------------------------------

    //FireBase
    implementation(platform("com.google.firebase:firebase-bom:33.0.0"))

    implementation ("com.google.firebase:firebase-config:")
    implementation("com.google.firebase:firebase-messaging")
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-auth")
//    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.6.4'

    //Dagger-Hilt
    implementation "com.google.dagger:hilt-android:2.49"
    kapt "com.google.dagger:hilt-android-compiler:2.49"

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.0"

    //Room
    def room_version = "2.6.1"

    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    //LOCATION
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.7.0")

    //WEBSOCKET
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    //SOCKET.IO
//    implementation ('io.socket:socket.io-client:2.0.0') {
//        exclude group: 'org.json', module: 'json'
//    }

    //QR Scanner Screen
    implementation('com.journeyapps:zxing-android-embedded:4.1.0') { transitive = false }
    implementation 'com.google.zxing:core:3.4.0'
    implementation group: 'commons-io', name: 'commons-io', version: '2.4'

    //BLUR library
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'

    //Google - Map
    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    //GLIDE
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    //WorkManager
    def work_version = "2.3.4"
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    implementation "androidx.work:work-runtime:2.9.0"

    //AWS
    def aws_version = "2.69.0"
    implementation "com.amazonaws:aws-android-sdk-s3:$aws_version"
    implementation ("com.amazonaws:aws-android-sdk-mobile-client:$aws_version") { transitive = true }
    implementation "com.amazonaws:aws-android-sdk-core:$aws_version"

    //google play service
    implementation 'com.google.android.gms:play-services-auth:21.1.1'

    //facebook login
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'

    //Lottie
    implementation 'com.airbnb.android:lottie:5.2.0'

    // Circular Progress Bar
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'

//    dokkaPlugin 'org.jetbrains.dokka:android-documentation-plugin:1.9.20'

}
